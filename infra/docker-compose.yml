services:
  postgres:
    image: postgres:16-alpine
    container_name: clutch-postgres
    environment:
      POSTGRES_USER: clutch
      POSTGRES_PASSWORD: clutch
      POSTGRES_DB: clutch
    ports:
      - "5432:5432"
    volumes:
      - clutch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clutch -d clutch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clutch-redis
    ports:
      - "6379:6379"
    volumes:
      - clutch_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clutch_pg_data:
  clutch_redis_data:
